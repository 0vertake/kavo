# Development dependencies. A single etcd node is deliberate: kavo's durability
# claims are about kavo, and an etcd cluster here would only slow the loop down.
# Production would run three or five.
services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    container_name: kavo-etcd
    command:
      - etcd
      - --name=kavo-etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://127.0.0.1:2379
    ports:
      - "2379:2379"
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 2s
      timeout: 2s
      retries: 15
